  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app43_hindi_number_tracing">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>app43_hindi_number_tracing</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.speakHindi = function(text, lang) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang || 'hi-IN';
        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        
        var voices = window.speechSynthesis.getVoices();
        var targetVoice = voices.find(function(v) {
          return v.lang && (v.lang.indexOf(lang === 'en-US' ? 'en' : 'hi') !== -1);
        });
        if (targetVoice) {
          utterance.voice = targetVoice;
        }
        window.speechSynthesis.speak(utterance);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
