    // ── Main TTS function called by Flutter AudioService ─────────────────────
    function speakHindi(key) {
      const text = hindiVocab[key] || key;
      _speak(text, 'hi-IN');
    }

    function _speak(text, lang) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang || 'hi-IN';
      utter.rate = 0.85;
      utter.pitch = 1.0;
      utter.volume = 1.0;

      // Prefer a Hindi voice if available
      const voices = window.speechSynthesis.getVoices();
      const hiVoice = voices.find(v =>
        v.lang.startsWith('hi') || v.name.toLowerCase().includes('hindi')
      );
      if (hiVoice) utter.voice = hiVoice;

      window.speechSynthesis.speak(utter);
    }

    // Voices load asynchronously — pre-warm them
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = function() {
        window.speechSynthesis.getVoices();
      };
      window.speechSynthesis.getVoices();
    }
