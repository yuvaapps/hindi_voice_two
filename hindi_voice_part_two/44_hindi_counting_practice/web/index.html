<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hindi Counting Practice - Learn to count in Hindi with fun animations">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hindi Counting Practice">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Hindi Counting Practice | गिनती सीखें</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Hindi TTS Engine — called by AudioService on web
    window.speakHindi = function(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var map = {
        'ek':'एक','do':'दो','teen':'तीन','chaar':'चार','paanch':'पाँच',
        'chhah':'छह','saat':'सात','aath':'आठ','nau':'नौ','das':'दस',
        'gyaarah':'ग्यारह','baarah':'बारह','terah':'तेरह','chaudah':'चौदह',
        'pandrah':'पंद्रह','solah':'सोलह','satrah':'सत्रह','attharah':'अठारह',
        'unnees':'उन्नीस','bees':'बीस',
        'ikkees':'इक्कीस','baais':'बाईस','teis':'तेईस','chaubbees':'चौबीस',
        'pachchees':'पच्चीस','chhabbees':'छब्बीस','sattaees':'सत्ताईस',
        'atthaees':'अट्ठाईस','unnattees':'उनतीस','tees':'तीस',
        'pachaas':'पचास','saath':'साठ','sattar':'सत्तर','assi':'अस्सी',
        'nabbe':'नब्बे','sau':'सौ',
        'kuttaa':'कुत्ता','billi':'बिल्ली','gaay':'गाय','ghoda':'घोड़ा',
        'haathi':'हाथी','sher':'शेर','baagh':'बाघ','bandar':'बंदर',
        'hiran':'हिरण','kharagosh':'खरगोश','bhaalu':'भालू','lomdi':'लोमड़ी',
        'seb':'सेब','kela':'केला','aam':'आम','angur':'अंगूर','santra':'संतरा',
        'laal':'लाल','neela':'नीला','hara':'हरा','peela':'पीला',
        'safed':'सफ़ेद','kaala':'काला',
        'sir':'सिर','aankh':'आँख','naak':'नाक','kaan':'कान','munh':'मुँह',
        'maa':'माँ','pita':'पिता','daada':'दादा','daadi':'दादी',
        'bhai':'भाई','bahan':'बहन',
      };
      var hindi = map[text] || text;
      var utt = new SpeechSynthesisUtterance(hindi);
      utt.lang = 'hi-IN';
      utt.rate = 0.8;
      utt.pitch = 1.1;
      utt.volume = 1.0;
      // Try to find a Hindi voice
      var voices = window.speechSynthesis.getVoices();
      var hiVoice = voices.find(function(v){ return v.lang && v.lang.startsWith('hi'); });
      if (hiVoice) utt.voice = hiVoice;
      window.speechSynthesis.speak(utt);
    };
    // Load voices
    if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
