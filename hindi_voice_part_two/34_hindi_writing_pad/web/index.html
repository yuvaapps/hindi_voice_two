<!DOCTYPE html>
<html>
<head>
  <!--

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app34_hindi_writing_pad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>app34_hindi_writing_pad</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.speakHindi = function(text, lang) {
      try {
        if (!window.speechSynthesis) return;
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = lang || 'hi-IN';
        u.rate = 0.85;
        u.pitch = 1.0;
        var voices = window.speechSynthesis.getVoices();
        if (voices && voices.length > 0) {
          var targetPrefix = (lang || 'hi').substring(0, 2).toLowerCase();
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang.toLowerCase().indexOf(targetPrefix) !== -1) {
              u.voice = voices[i];
              break;
            }
          }
        }
        window.speechSynthesis.speak(u);
      } catch (e) {
        console.warn('speakHindi error:', e);
      }
    };

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = function() {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
