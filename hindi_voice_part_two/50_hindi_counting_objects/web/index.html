<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hindi Counting Objects - Interactive counting objects learning game for kids with Hindi audio voice and animations.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hindi Counting Objects">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Hindi Counting Objects | वस्तु गिनें</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // ── Hindi Numbers 1 to 100 ────────────────────────────────────────────────
    const hi1to100Words = [
      "", "एक", "दो", "तीन", "चार", "पाँच", "छह", "सात", "आठ", "नौ", "दस",
      "ग्यारह", "बारह", "तेरह", "चौदह", "पंद्रह", "सोलह", "सत्रह", "अठारह", "उन्नीस", "बीस",
      "इक्कीस", "बाईस", "तेईस", "चौबीस", "पच्चीस", "छब्बीस", "सत्ताईस", "अट्ठाईस", "उनतीस", "तीस",
      "इकतीस", "बत्तीस", "तैंतीस", "चौंतीस", "पैंतीस", "छत्तीस", "सैंतीस", "अड़तीस", "उनतालीस", "चालीस",
      "इकतालीस", "बयालीस", "तैंतालीस", "चौवालीस", "पैंतालीस", "छियालीस", "सैंतालीस", "अड़तालीस", "उनचास", "पचास",
      "इक्यावन", "बावन", "तिरपन", "चौवन", "पचपन", "छप्पन", "सत्तावन", "अट्ठावन", "उनसठ", "साठ",
      "इकसठ", "बासठ", "तिरसठ", "चौंसठ", "पैंसठ", "छियासठ", "सड़सठ", "अड़सठ", "उनहत्तर", "सत्तर",
      "इकहत्तर", "बहत्तर", "तिहत्तर", "चौहत्तर", "पचहत्तर", "छिहत्तर", "सतहत्तर", "अठहत्तर", "उनासी", "अस्सी",
      "इक्यासी", "बयासी", "तिरासी", "चौरासी", "पचासी", "छियासी", "सत्तासी", "अट्ठासी", "नवासी", "नब्बे",
      "इक्यानवे", "बानवे", "तिरानवे", "चौरानवे", "पंचानवे", "छियानवे", "सत्तानवे", "अट्ठानवे", "निन्यानवे", "सौ"
    ];

    function getHindiNumberWord(n) {
      if (n >= 1 && n <= 100) return hi1to100Words[n];
      if (n === 1000) return "एक हज़ार";
      if (n > 100 && n < 1000) {
        const h = Math.floor(n / 100);
        const rem = n % 100;
        const hiHundreds = ["", "एक सौ", "दो सौ", "तीन सौ", "चार सौ", "पाँच सौ", "छह सौ", "सात सौ", "आठ सौ", "नौ सौ"];
        if (rem === 0) return hiHundreds[h];
        return hiHundreds[h] + " " + hi1to100Words[rem];
      }
      return String(n);
    }

    // ── Hindi Vocabulary Map ───────────────────────────────────────────────────
    const hindiVocab = {
      // Feedback
      'feedback_correct': 'शाबाश! सही गिना!',
      'feedback_great': 'शानदार! बिल्कुल सही!',
      'feedback_try': 'फिर से गिनें!',

      // Numbers 1-10
      'ek':'एक', 'do':'दो', 'teen':'तीन', 'chaar':'चार', 'paanch':'पाँच',
      'chhah':'छह', 'saat':'सात', 'aath':'आठ', 'nau':'नौ', 'das':'दस',

      // Animals & Objects
      'kutta':'कुत्ता', 'kutte':'कुत्ते', 'billi':'बिल्ली', 'billiyan':'बिल्लियाँ',
      'seb':'सेब', 'phal':'फल', 'phool':'फूल', 'taare':'तारे', 'tara':'तारा',
      'suraj':'सूरज', 'chand':'चाँद', 'baadal':'बादल', 'gaadi':'गाड़ी',
      'gaadiyan':'गाड़ियाँ', 'gubbare':'गुब्बारे', 'pustak':'पुस्तक',
      'kitaab':'किताब', 'kitaabein':'किताबें', 'kalam':'कलम', 'pencil':'पेंसिल'
    };

    function speakHindi(key, slow) {
      let text = hindiVocab[key];
      if (!text) {
        if (typeof key === 'number') {
          text = getHindiNumberWord(key);
        } else if (typeof key === 'string') {
          if (key.startsWith('num_')) {
            const num = parseInt(key.replace('num_', ''), 10);
            if (!isNaN(num)) text = getHindiNumberWord(num);
          } else {
            const num = parseInt(key, 10);
            if (!isNaN(num) && String(num) === key.trim()) {
              text = getHindiNumberWord(num);
            } else {
              text = key;
            }
          }
        }
      }
      _speak(text || key, 'hi-IN', slow === true);
    }

    function stopSpeech() {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    }

    function _speak(text, lang, slow) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang || 'hi-IN';
      utter.rate = slow ? 0.65 : 0.85;
      utter.pitch = 1.0;
      utter.volume = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const hiVoice = voices.find(v => v.lang.startsWith('hi') || v.lang.includes('Hindi'));
      if (hiVoice) utter.voice = hiVoice;

      window.speechSynthesis.speak(utter);
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
